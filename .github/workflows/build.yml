name: Build

on:
  schedule:
    - cron: '30 3 * * *'  # Runs at 03:30 UTC every day
  workflow_dispatch:
    inputs:
      tag:
        description: 'Single tag to build or alias to retag (leave empty to build all)'
        required: false
        type: string

jobs:
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      aliases: ${{ steps.set.outputs.aliases }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set matrix
        id: set
        run: |
          requested_alias=""
          alias_source=""

          if [ -n "${{ inputs.tag }}" ]; then
            matrix=$(jq -c --arg tag "${{ inputs.tag }}" '[.[] | select(.tag == $tag)]' versions.json)
            if [ "$(echo "$matrix" | jq 'length')" = "0" ]; then
              # Not a real tag — maybe an alias
              alias_source=$(jq -r --arg t "${{ inputs.tag }}" '.[] | select((.aliases // []) | index($t)) | .tag' versions.json)
              if [ -z "$alias_source" ]; then
                echo "Unknown tag or alias: ${{ inputs.tag }}" >&2
                exit 1
              fi
              matrix='[]'
              requested_alias="${{ inputs.tag }}"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            day_of_week=$(date +%u)
            week_number=$(date +%V)
            if [ "$day_of_week" = "7" ] && [ $((week_number % 2)) -eq 0 ]; then
              # Biweekly Sunday: build all tags
              matrix=$(jq -c '.' versions.json)
            else
              # Other days: nightly only
              matrix=$(jq -c '[.[] | select(.tag == "nightly")]' versions.json)
            fi
          else
            # Manual trigger with no tag: build all
            matrix=$(jq -c '.' versions.json)
          fi

          # Derive aliases to retag: from the build matrix, plus an explicit alias request
          if [ -n "$requested_alias" ]; then
            aliases=$(jq -nc --arg a "$requested_alias" --arg s "$alias_source" '[{alias: $a, source: $s}]')
          else
            aliases=$(echo "$matrix" | jq -c '[.[] | . as $e | (.aliases // [])[] | {alias: ., source: $e.tag}]')
          fi

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "aliases={\"include\":$aliases}" >> "$GITHUB_OUTPUT"

  docker:
    name: ${{ matrix.tag }}
    needs: load-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set composer.json
        run: |
          cp "composer_json/${{ matrix.composer_json }}.json" composer.json
          jq --arg v "${{ matrix.maho }}" '.require["mahocommerce/maho"] = $v' composer.json > tmp && mv tmp composer.json

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: cloud
          endpoint: "mahocommerce/maho"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: "mahocommerce/maho:${{ matrix.tag }}"
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            DEBIAN_VARIANT=${{ matrix.debian }}
            MYSQL=${{ matrix.mysql }}
            PGSQL=${{ matrix.pgsql }}
            SQLITE=${{ matrix.sqlite }}
          outputs: "type=registry"

  retag:
    name: ${{ matrix.alias }}
    needs: [load-matrix, docker]
    if: ${{ always() && needs.docker.result != 'failure' && needs.docker.result != 'cancelled' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.load-matrix.outputs.aliases) }}
      fail-fast: false
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Retag
        run: docker buildx imagetools create -t mahocommerce/maho:${{ matrix.alias }} mahocommerce/maho:${{ matrix.source }}
